name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: unzip SalesCalc-project.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        # Ищем файл gradlew и запускаем сборку из его папки
        find . -name "gradlew" -exec dirname {} \; | head -n 1 | xargs -I {} sh -c "cd {} && chmod +x gradlew && ./gradlew assembleDebug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SalesCalc-APK
        path: "**/build/outputs/apk/debug/*.apk"
