name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project to separate folder
      run: |
        mkdir build_folder
        unzip -q SalesCalc-bundle.zip -d build_folder

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        cd build_folder
        if [ -d "SalesCalc" ]; then cd SalesCalc; fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SalesCalc-APK-New
        path: "build_folder/**/build/outputs/apk/debug/*.apk"